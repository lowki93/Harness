name: ios

on:
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "import json,sys; print(next(d['udid'] for r in json.load(sys.stdin)['devices'].values() for d in r if d['name'].startswith('iPhone')))")
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Test
        run: >
          xcodebuild
          -project apps/ios/Harness.xcodeproj
          -scheme Harness
          -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -derivedDataPath "$RUNNER_TEMP/harness-ios-dd"
          CODE_SIGNING_ALLOWED=NO
          test
