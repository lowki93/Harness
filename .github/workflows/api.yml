name: api

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contract/**"
      - "packages/web-client/**"
      - "package.json"
      - "tsconfig.base.json"
      - "bun.lock"
      - "compose.yaml"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/contract/**"
      - "packages/web-client/**"
      - "package.json"
      - "tsconfig.base.json"
      - "bun.lock"
      - "compose.yaml"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run generate
      - name: Run migrations twice (wiring smoke test, the second run is a no-op)
        env:
          DATABASE_URL: postgres://harness:harness@localhost:5432/harness
        run: |
          bun run --filter @harness/api migrate
          bun run --filter @harness/api migrate
      - name: Check the contract and client are up to date
        run: |
          git diff --exit-code -- packages/ || (echo "Contract or client out of date: run bun run generate" && exit 1)
