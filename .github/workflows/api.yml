name: api

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/contract/**"
      - "packages/web-client/**"
      - "package.json"
      - "tsconfig.base.json"
      - "bun.lock"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/contract/**"
      - "packages/web-client/**"
      - "package.json"
      - "tsconfig.base.json"
      - "bun.lock"
      - ".github/workflows/api.yml"

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run generate
      - name: Check the contract and client are up to date
        run: |
          git diff --exit-code -- packages/ || (echo "Contract or client out of date: run bun run generate" && exit 1)
