name: web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/web-client/**"
      - "packages/contract/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/web-client/**"
      - "packages/contract/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run --filter @harness/web typecheck
      - run: bun run --filter @harness/web test
      - run: bun run --filter @harness/web build
